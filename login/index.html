<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Contact Us</h1>
            <p class="text-slate-500 mt-2">Fill in your details and I'll see them instantly in my spreadsheet.</p>
        </div>

        <form id="dataForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Your Message</label>
                <textarea id="message" rows="4" required placeholder="How can I help you?"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-200 transition-all active:scale-[0.98]">
                Submit Information
            </button>
        </form>

        <div id="statusBox" class="mt-6 hidden p-4 rounded-lg text-center font-medium">
            <!-- Status message will appear here -->
        </div>
    </div>

    <script>
        // Updated SCRIPT_URL with your new deployment ID
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqNbnFPl67DNqDpessEhqIL59lSrJE8VhZVxPyD3qJ11qijmbRHuQYJDvgdzVESUL7/exec";

        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader"></div> Sending...';
            statusBox.classList.add('hidden');

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                // Using 'no-cors' mode to reliably send data to Google Apps Script
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                form.reset();
                showStatus('Success! Check your Google Sheet.', 'bg-green-100', 'text-green-700');
            } catch (error) {
                console.error('Error!', error.message);
                showStatus('Error sending data. Please check your connection.', 'bg-red-100', 'text-red-700');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Information';
            }
        });

        function showStatus(msg, bgColor, textColor) {
            statusBox.innerText = msg;
            statusBox.className = `mt-6 p-4 rounded-lg text-center font-medium ${bgColor} ${textColor}`;
            statusBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
