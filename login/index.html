<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7150683500942089" crossorigin="anonymous"></script>

    <title>Live Data Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-cyan-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full glass-card rounded-3xl shadow-2xl p-8 transform transition-all">
        <div class="mb-10 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Submit Info</h1>
            <p class="text-slate-500 mt-2">Information is sent to your sheet instantly.</p>
        </div>

        <form id="dataForm" class="space-y-6">
            <div class="space-y-1">
                <label class="text-sm font-bold text-slate-700 ml-1">Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400">
            </div>

            <div class="space-y-1">
                <label class="text-sm font-bold text-slate-700 ml-1">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400">
            </div>

            <div class="space-y-1">
                <label class="text-sm font-bold text-slate-700 ml-1">Notes</label>
                <textarea id="message" rows="3" required placeholder="What's on your mind?"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 resize-none"></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-xl shadow-indigo-200 transition-all flex items-center justify-center gap-2 group active:scale-[0.98]">
                <span>Send Information</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <div id="statusBox" class="mt-8 hidden p-4 rounded-xl text-center font-semibold text-sm animate-pulse">
            <!-- Status message -->
        </div>
    </div>

    <script>
        // Your specific Web App URL from the deployment
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqNbnFPl67DNqDpessEhqIL59lSrJE8VhZVxPyD3qJ11qijmbRHuQYJDvgdzVESUL7/exec";

        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            const originalContent = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="loader"></div>';
            statusBox.classList.add('hidden');

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                // Using no-cors mode to bypass redirect issues common with Google Apps Scripts
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData),
                });

                // Reset and notify
                form.reset();
                showStatus('✨ Success! Check your Google Sheet.', 'bg-green-50', 'text-green-600');
                
                // Refresh button after 2 seconds
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalContent;
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ Failed to send. Check console.', 'bg-red-50', 'text-red-600');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalContent;
            }
        });

        function showStatus(msg, bgColor, textColor) {
            statusBox.innerText = msg;
            statusBox.className = `mt-8 p-4 rounded-xl text-center font-semibold text-sm ${bgColor} ${textColor}`;
            statusBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
