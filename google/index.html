<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --primary: #6366f1;
      --bg: #f8fafc;
      --text: #1e293b;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h1 { color: var(--primary); margin-top: 0; }
    p.description { color: #64748b; font-size: 0.95rem; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    
    input[type="text"],
    input[type="number"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      box-sizing: border-box;
      font-size: 1rem;
    }
    
    .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .radio-item { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; }
    
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    #status {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.5rem;
      display: none;
      text-align: center;
    }
    .success { background: #dcfce7; color: #166534; display: block !important; }
  </style>
</head>
<body>

<div class="card">
  <h1>Party Invite</h1>
  <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur quis sem odio. Sed commodo vestibulum leo, sit amet tempus odio consectetur in.</p>

  <form id="rsvpForm">
    <div class="form-group">
      <label>What is your name?</label>
      <input type="text" name="name" required>
    </div>

    <div class="form-group">
      <label>Can you attend? *</label>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="attendance" value="Yes" required> Yes, I'll be there</label>
        <label class="radio-item"><input type="radio" name="attendance" value="No"> Sorry, can't make it</label>
      </div>
    </div>

    <div class="form-group">
      <label>How many of you are attending?</label>
      <input type="number" name="guests" min="0" value="1">
    </div>

    <div class="form-group">
      <label>What will you be bringing?</label>
      <select name="dish">
        <option value="Mains">Mains</option>
        <option value="Salad">Salad</option>
        <option value="Dessert">Dessert</option>
        <option value="Drinks">Drinks</option>
        <option value="Sides/Appetizers">Sides/Appetizers</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Let us know what kind of dish(es) you'll be bringing</label>
      <textarea name="details" rows="2" placeholder="e.g. Potato Salad"></textarea>
    </div>

    <div class="form-group">
      <label>Do you have any allergies or dietary restrictions?</label>
      <input type="text" name="allergies">
    </div>

    <div class="form-group">
      <label>What is your email address?</label>
      <input type="email" name="email" required>
    </div>

    <button type="submit" id="submitBtn">Send RSVP</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const form = document.getElementById('rsvpForm');
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    btn.disabled = true;
    btn.innerText = "Sending...";
    
    // Call the server-side function in Code.gs
    google.script.run
      .withSuccessHandler(function(response) {
        status.innerText = "Thank you! Your RSVP has been saved.";
        status.className = "success";
        form.reset();
        btn.style.display = "none";
      })
      .withFailureHandler(function(err) {
        status.innerText = "Error: " + err;
        status.style.display = "block";
        btn.disabled = false;
        btn.innerText = "Send RSVP";
      })
      .processForm(this);
  });
</script>

</body>
</html>
